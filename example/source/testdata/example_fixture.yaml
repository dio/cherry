org_id: org1

projects:
  - id: project1
    org_id: org1
  - id: project2
    org_id: org1

workspaces:
  - id: workspace1
    project_id: project1
  - id: workspace2
    project_id: project1
  - id: workspace3
    project_id: project2

users:
  - id: alice
    org_id: org1
    tag_ids:
      - marketing
  - id: bob
    org_id: org1
    tag_ids: []

user_assignments:
  - user_id: alice
    scope: project
    project_id: project1
    workspace_id: ""
  - user_id: bob
    scope: workspace
    project_id: project1
    workspace_id: workspace1
  - user_id: bob
    scope: workspace
    project_id: project1
    workspace_id: workspace2
  - user_id: bob
    scope: project
    project_id: project2
    workspace_id: ""

keys:
  - id: project1-key
    slug: slug:project1
    user_id: alice
    project_id: project1
    workspace_id: ""
    scope: project
    tag_ids: []
  - id: workspace1-key
    slug: slug:workspace1
    user_id: bob
    project_id: project1
    workspace_id: workspace1
    scope: workspace
    tag_ids:
      - marketing
  - id: workspace1-byok-always-key
    slug: slug:workspace1-byok-always
    user_id: bob
    project_id: project1
    workspace_id: workspace1
    scope: workspace
    tag_ids:
      - byok-always
  - id: workspace1-byok-preferred-key
    slug: slug:workspace1-byok-preferred
    user_id: bob
    project_id: project1
    workspace_id: workspace1
    scope: workspace
    tag_ids:
      - byok-preferred
  - id: workspace2-key
    slug: slug:workspace2
    user_id: bob
    project_id: project1
    workspace_id: workspace2
    scope: workspace
    tag_ids:
      - split-openai
  - id: project2-key
    slug: slug:project2
    user_id: bob
    project_id: project2
    workspace_id: ""
    scope: project
    tag_ids:
      - autofallback-anthropic-vertex

tags:
  marketing:
    id: marketing
    llm_rule:
      id: tag:marketing
      specificity: tag
      routing_overrides:
        "@anthropic":
          target:
            provider: openai
            name: gpt-4o-mini
            secret_ref: env://MARKETING_OPENAI_KEY
      rate_limit:
        usd_per_day: 50
        rpm: 60
        on_exceed: reject
  byok-always:
    id: byok-always
    llm_rule:
      id: tag:byok-always
      specificity: tag
      routing_overrides:
        "@anthropic":
          target:
            provider: anthropic
            secret_ref: env://WORKSPACE1_BYOK_ANTHROPIC_KEY
  byok-preferred:
    id: byok-preferred
    llm_rule:
      id: tag:byok-preferred
      specificity: tag
      routing_overrides:
        "@openai":
          chain:
            retry:
              retry_on: "401"
              per_try_timeout_ms: 10000
            children:
              - target:
                  provider: openai
                  secret_ref: env://ANTHROPIC_API_KEY
              - target:
                  provider: openai
        "@anthropic":
          chain:
            retry:
              retry_on: "401"
              per_try_timeout_ms: 10000
            children:
              - target:
                  provider: anthropic
                  secret_ref: env://WORKSPACE1_BYOK_ANTHROPIC_KEY
              - target:
                  provider: anthropic
  split-openai:
    id: split-openai
    llm_rule:
      id: tag:split-openai
      specificity: tag
      routing_overrides:
        claude-haiku-4-5:
          split:
            children:
              - weight: 80
                target:
                  provider: openai
                  name: gpt-4o-mini
                  secret_ref: env://OPENAI_API_KEY
              - weight: 20
                target:
                  provider: fallback_p2
                  name: gpt-4o-mini
                  secret_ref: literal://fake
  autofallback-anthropic-vertex:
    id: autofallback-anthropic-vertex
    llm_rule:
      id: tag:autofallback-anthropic-vertex
      specificity: tag
      routing_overrides:
        "@anthropic":
          chain:
            retry:
              retry_on: "connect-failure,reset,5xx,retriable-status-codes"
              per_try_timeout_ms: 10000
            children:
              - target: { provider: fallback_p1, name: claude-haiku-4-5 }
              - target: { provider: fallback_p2, name: claude-haiku-4-5 }
              - target: { provider: fallback_p3, name: claude-haiku-4-5 }
              - target: { provider: vertex_anthropic, name: claude-opus-4@20250514 }

profiles:
  - id: dev-tools
    slug: slug:profile-dev-tools
    path: profile-dev-tools
    workspace_id: workspace1
    auth:
      type: none
    tools:
      github:
        auth:
          type: bearer
          secret_ref: env://GITHUB_TOKEN
        include:
          - list-repos
      kiwi:
        include:
          - search-flight
  - id: kiwi-and-github
    slug: slug:profile-kiwi-and-github
    path: profile-kiwi-and-github
    workspace_id: workspace1
    auth:
      type: none
    tools:
      github:
        auth:
          type: bearer
          secret_ref: env://GITHUB_TOKEN
        include:
          - list-repos
      kiwi:
        include:
          - search-flight

models:
  - id: claude-haiku-4-5
    provider: anthropic
    name: claude-haiku-4-5-20251001
  - id: claude-sonnet-4-5
    provider: anthropic
    name: claude-sonnet-4-5-20251001
  - id: gpt-4o-mini
    provider: openai
    name: gpt-4o-mini
  - id: gpt-4o-mini-2
    provider: openai
    name: gpt-4o-mini-20241001
  - id: claude-opus-4@20250514
    provider: vertex_anthropic
    name: claude-opus-4@20250514

providers:
  - id: anthropic
    kind: anthropic
    endpoint: https://api.anthropic.com
    secret_ref: env://ANTHROPIC_API_KEY
    auth_type: bearer
    path_prefix: ""
    request_mutations:
      "*":
        headers:
          x-provider-id: anthropic-default
        body:
          providerId: anthropic-default
    response_mutations: {}
  - id: openai
    kind: openai
    endpoint: https://api.openai.com
    secret_ref: env://OPENAI_API_KEY
    auth_type: bearer
    path_prefix: ""
    request_mutations:
      "*":
        headers:
          x-provider-id: openai-default
        body:
          providerId: openai-default
    response_mutations: {}
  - id: vertex_anthropic
    kind: anthropic
    endpoint: https://us-east5-aiplatform.googleapis.com
    secret_ref: env://VERTEX_ANTHROPIC_API_KEY
    auth_type: bearer
    path_prefix: ""
    request_mutations:
      "*":
        headers:
          x-provider-id: vertex-anthropic-default
        body:
          providerId: vertex-anthropic-default
    response_mutations: {}
  - id: fallback_p1
    kind: anthropic
    endpoint: https://192.0.2.1
    secret_ref: literal://fake
    auth_type: bearer
    path_prefix: ""
    request_mutations: {}
    response_mutations: {}
  - id: fallback_p2
    kind: anthropic
    endpoint: https://192.0.2.2
    secret_ref: literal://fake
    auth_type: bearer
    path_prefix: ""
    request_mutations: {}
    response_mutations: {}
  - id: fallback_p3
    kind: anthropic
    endpoint: https://192.0.2.3
    secret_ref: literal://fake
    auth_type: bearer
    path_prefix: ""
    request_mutations: {}
    response_mutations: {}

mcp_servers:
  - id: kiwi
    endpoint: https://mcp.kiwi.com
    secret_ref: env://KIWI_MCP_TOKEN
    auth_type: bearer
    tools:
      - search-flight
  - id: github
    endpoint: https://api.github.com
    secret_ref: env://GITHUB_MCP_TOKEN
    auth_type: bearer
    tools:
      - list-repos
